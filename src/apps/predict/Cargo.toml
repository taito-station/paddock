[package]
name = "predict"
version = "0.1.0"
edition = "2024"

[lib]
name = "predict"
path = "src/lib.rs"

[[bin]]
name = "paddock-predict"
path = "src/bin.rs"

[dependencies]
anyhow             = { workspace = true }
chrono             = { workspace = true }
clap               = { workspace = true }
paddock-config     = { workspace = true }
paddock-domain     = { workspace = true }
paddock-use-case   = { workspace = true }
# 発走状態の判定（classify / has_result）を predict-watch と共有するため（#587）。
monitor-loop       = { workspace = true }
netkeiba-scraper   = { workspace = true }
predict-format     = { workspace = true }
rdb-gateway        = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/overview.rs の `#[sqlx::test]`（一時DB作成 + migration 適用）と raw SQL スナップショット用。
sqlx = { workspace = true }
