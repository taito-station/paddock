# mdq (Markdown Query) の索引対象。BM25・完全ローカル。詳細は tools/mdq/mdq/config.py。
# 存在しないディレクトリは自動スキップされる（knowledge/qa/original-docs は段階導入）。
[index]
roots = [
  # ADR は ADR 0073 で docs/original-docs に統合した（一次資料層）。ここに "docs/adr" を残すと
  # 同一ファイルを 2 root から索引しに行くため（iter_markdown は roots を重複除去しない）追加しない。
  "docs/specifications",
  "docs/knowledge",
  "docs/qa",
  "docs/original-docs",
]
